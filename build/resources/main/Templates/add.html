
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Civic Bridge Request</title>
</head>
<body>

<h1>Submit a Civic Bridge Request</h1>

<form th:action="@{/request/add}"
      th:object="${request}"
      method="post">

    <label>Title:</label>
    <input type="text" th:field="*{title}" required>
    <br><br>

    <label>Description:</label>
    <textarea th:field="*{description}" required></textarea>
    <br><br>

    <label>Priority:</label>
    <select th:field="*{priority}">
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
    </select>
    <br><br>

    <label>Status:</label>
    <select th:field="*{currentStatus}">
        <option value="PENDING">Pending</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="COMPLETED">Completed</option>
    </select>
    <br><br>

    <label>Location:</label>
    <input type="text" th:field="*{locationAddress}" required>
    <br><br>

    <button type="submit">Submit Request</button>

</form>

<br>
<a th:href="@{/request}">Back to Requests</a>

</body>
</html>
