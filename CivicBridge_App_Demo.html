function navItem(name,label,iconName){return `<button class="nav-item ${state.screen===name?'active':''}" data-go="${name}"><span class="nav-icon">${ico(iconName,18)}</span>${label}</button>`}
function shell(content){let staff=isStaff();let heading={dashboard:'Overview',new:'New request',my:'My requests',detail:'Request tracking',staff:'Service queue',staffdetail:'Request management'}[state.screen];return `<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">${ico('building',23)}</div><div><strong>CivicBridge</strong><small>COMMUNITY CONNECTED</small></div></div><div class="side-label">${staff?'Employee workspace':'Resident portal'}</div><nav>${staff?navItem('staff','Service Requests','list')+navItem('staffdetail','Manage Request','file')+`<button class="nav-item" data-go="dashboard"><span class="nav-icon">${ico('back')}</span>Resident View</button>`:navItem('dashboard','Dashboard','home')+navItem('new','New Service Request','plus')+navItem('my','My Requests','list')+`<button class="nav-item" data-go="new"><span class="nav-icon">${ico('help')}</span>Help & Support</button>`}</nav><div class="side-label">Workspace</div><nav><button class="nav-item" data-go="${staff?'staff':'dashboard'}"><span class="nav-icon">${ico('chart')}</span>Overview & Insights</button><button class="nav-item" data-go="${staff?'staff':'my'}"><span class="nav-icon">${ico('bell')}</span>Updates & Alerts</button></nav><div class="side-bottom"><button id="demo-logout" type="button" style="display:flex;align-items:center;gap:9px;background:#ffffff16;color:white;border:1px solid #ffffff33;border-radius:9px;padding:9px 11px;width:100%;margin-bottom:17px;font-size:12px;font-weight:700">${ico('back',15)} Sign out</button><div class="mini"><div class="avatar">${staff?'PW':'JC'}</div><div><strong>${staff?'Taylor Morgan':'Jordan Carter'}</strong><span>${staff?'Public Works · Staff':'Riverton resident'}</span></div></div></div></aside><div class="main"><div class="topbar"><div class="crumb">${ico('home',16)} <span>City services</span> ${ico('chevron',13)} <span class="current">${heading}</span></div><div class="righttop"><button class="mode" data-go="${staff?'dashboard':'staff'}">${ico('users',15)} ${staff?'Switch to resident view':'Preview staff workspace'} ${ico('arrow',13)}</button><button class="topicon" aria-label="Notifications" data-go="${staff?'staff':'my'}">${ico('bell',17)}</button><div class="top-sep"></div><div class="user-top"><div class="avatar">${staff?'TM':'JC'}</div><div><strong>${staff?'Taylor Morgan':'Jordan Carter'}</strong><span>${staff?'Staff account':'Resident account'}</span></div></div></div></div><main class="content">${content}<div class="footer-note">CivicBridge · High-fidelity educational prototype · Fictional requests and accounts · No backend or public service connection</div></main></div></div><div class="demo-flag">Interactive concept • Sample data only</div>`}
function heading(ey,title,subtitle,btn=''){return `<div class="heading-row"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="lead">${subtitle}</p></div>${btn}</div>`}
function stat(iconName,number,label,kind=''){return `<div class="stat"><div class="stat-icon ${kind}">${ico(iconName,23)}</div><div><strong>${number}</strong><span>${label}</span></div></div>`}
function dashboard(){let mine=state.requests.filter(x=>x.resident==='Jordan Carter');return `${heading('Resident portal','Your community, connected.','View updates, follow active issues, and let your local government know what needs attention.')}
<div class="hero"><div><div class="greeting">WELCOME BACK, JORDAN</div><h2>Making Riverton better, together.</h2><p>Every report helps build a safer, stronger neighborhood. Have something to share with city services?</p></div><button class="btn" data-go="new">${ico('plus',16)} Submit a service request ${ico('arrow',15)}</button></div>
<div class="stats">${stat('file',mine.filter(x=>x.status==='Open').length,'Open requests','gold')}${stat('clock',mine.filter(x=>x.status==='In Progress').length,'In progress')}${stat('checkcircle',mine.filter(x=>x.status==='Resolved').length,'Resolved requests','green')}</div>
<div class="columns"><div class="panel panel-pad"><div class="panel-head"><div><h2>Recent service requests</h2><small>Track the latest activity on your reports</small></div><button class="btn btn-ghost" data-go="my">View all ${ico('arrow',14)}</button></div><table class="req-table"><thead><tr><th>Request</th><th>Category</th><th>Submitted</th><th>Status</th><th></th></tr></thead><tbody>${mine.map(r=>`<tr data-open="${r.id}"><td><span class="id">${r.id}</span><span class="primary" style="display:block;margin-top:4px">${escapeHtml(r.title)}</span></td><td>${escapeHtml(r.category)}</td><td>${r.submitted}</td><td>${badge(r.status)}</td><td style="color:#88a0af">${ico('chevron',17)}</td></tr>`).join('')}</tbody></table></div><div><div class="panel panel-pad" style="margin-bottom:17px"><div class="panel-head"><h2>How it works</h2></div>${[['1','Report an issue','Tell us what needs attention.'],['2','Follow the progress','See when a team picks up your request.'],['3','Get it resolved','Receive updates through completion.']].map(x=>`<div class="info-box"><div class="info-num">${x[0]}</div><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div><div class="panel panel-pad"><div class="panel-head"><h2>Popular categories</h2></div><div class="category-grid">${[['road','Roads'],['leaf','Parks'],['trash','Waste'],['building','Facilities']].map(x=>`<button class="category" data-go="new"><span class="category-icon">${ico(x[0],18)}</span>${x[1]}</button>`).join('')}</div></div></div></div>`}
function form(){return `${heading('Create a request','Submit a service request','Share the details and our team will route your concern to the right department.')}
<div class="panel form-card"><div class="form-top"><div><h2>Tell us what is happening</h2><p class="muted" style="font-size:12px;margin:5px 0 0">Fields marked with * are required.</p></div><div class="steps"><span class="step current"><span class="stepnum">1</span>Report issue</span>${ico('chevron',13)}<span class="step"><span class="stepnum">2</span>Submit</span>${ico('chevron',13)}<span class="step"><span class="stepnum">3</span>Track</span></div></div>
<form id="request-form"><div class="form-grid"><div><div class="field"><label class="label" for="f-title">Request title <span class="required">*</span></label><input required id="f-title" maxlength="80" placeholder="e.g. Broken streetlight on Oak Street"/></div><div class="field"><label class="label" for="f-category">Service category <span class="required">*</span></label><select required id="f-category"><option value="">Select a service category</option><option>Roads & Streets</option><option>Streetlights</option><option>Parks & Recreation</option><option>Waste & Recycling</option><option>Public Facilities</option></select></div><div class="field"><label class="label" for="f-address">Issue location <span class="required">*</span></label><input required id="f-address" placeholder="Street address or nearby intersection"/><span class="hint">Include a landmark or intersection to help the city locate the issue.</span></div><div class="field"><label class="label" for="f-description">Description <span class="required">*</span></label><textarea required id="f-description" placeholder="Describe what you noticed, when it occurred, and any helpful details..."></textarea></div><div class="tip">${ico('shield',18)}<span>For emergencies or immediate threats to safety, contact emergency services. This portal is for non-emergency requests.</span></div></div>
<div><div class="field"><label class="label">Location preview</label><div class="map"><div class="map-pin">${ico('map',17)}</div></div><span class="hint">Illustrative map placeholder — not live geocoding.</span></div><div class="field"><label class="label">Add a photo (optional)</label><label class="upload" for="f-photo" style="display:block;cursor:pointer">${ico('upload',25)}<strong>Choose a photo to attach</strong><span>JPEG or PNG · For demonstration only</span><input id="f-photo" type="file" accept="image/png,image/jpeg" style="position:absolute;left:-9999px"/></label><span id="photo-status" class="hint"></span></div><div class="field"><label class="label" for="f-priority">How urgent is this issue?</label><select id="f-priority"><option>Low</option><option selected>Medium</option><option>High</option></select><span class="hint">City staff will review and may adjust the priority.</span></div></div></div><div class="bottom-actions"><button type="button" class="btn btn-secondary" data-go="dashboard">Cancel</button><button class="btn btn-primary" type="submit">Submit service request ${ico('arrow',15)}</button></div></form></div>`}
function my(){let mine=state.requests.filter(x=>x.resident==='Jordan Carter'&&(state.statusFilter==='All statuses'||x.status===state.statusFilter));return `${heading('Request history','My service requests','Every request in one place, from initial report through resolution.',`<button class="btn btn-primary" data-go="new">${ico('plus',17)} New request</button>`)}<div class="panel panel-pad"><div class="panel-head"><h2>All submitted requests</h2><span class="muted" style="font-size:12px">${mine.length} results</span></div><div class="filterbar"><div class="search">${ico('search',17)}<input placeholder="Search request titles or IDs" id="my-search"/></div><select class="filter" id="my-filter">${['All statuses','Open','In Progress','Resolved'].map(x=>`<option ${x===state.statusFilter?'selected':''}>${x}</option>`).join('')}</select></div><div id="my-rows"><table class="req-table"><thead><tr><th>Request ID / Title</th><th>Service category</th><th>Submitted</th><th>Assigned department</th><th>Status</th><th></th></tr></thead><tbody>${mine.map(r=>`<tr data-open="${r.id}"><td><span class="id">${r.id}</span><span class="primary" style="display:block;margin-top:3px">${escapeHtml(r.title)}</span></td><td>${r.category}</td><td>${r.submitted}</td><td>${r.department}</td><td>${badge(r.status)}</td><td>${ico('chevron',16)}</td></tr>`).join('')}</tbody></table></div></div>`}
function detail(){let r=getReq();let statusN=r.status==='Resolved'?3:r.status==='In Progress'?2:0;return `${heading('Request details',`<span style="color:#8598a8">${r.id}</span> · ${escapeHtml(r.title)}`,`Reported on ${r.submitted} · ${escapeHtml(r.location)}`,`<button class="btn btn-secondary" data-go="my">${ico('back',16)} Back to requests</button>`)}<div class="notice"><div>${ico('checkcircle',17)} &nbsp;<strong>Request on file.</strong> The latest status is ${r.status.toLowerCase()}. Track updates below.</div>${badge(r.status)}</div><div class="layout-detail"><div><div class="panel panel-pad" style="margin-bottom:18px"><div class="panel-head"><h2>Request overview</h2>${badge(r.status)}</div><p style="font-size:13px;color:#526a7c;line-height:1.7">${escapeHtml(r.description)}</p><div class="kv"><div><label>Category</label><span>${escapeHtml(r.category)}</span></div><div><label>Location</label><span>${escapeHtml(r.location)}</span></div><div><label>Assigned to</label><span>${escapeHtml(r.department)}</span></div></div></div><div class="panel panel-pad" style="margin-bottom:18px"><div class="panel-head"><div><h2>Request progress</h2><small>Milestones from report to resolution</small></div></div><div class="timeline">${['Submitted','Under review','In progress','Resolved'].map((x,i)=>`<div class="milestone ${i<statusN?'complete':i===statusN?'current':''}"><div class="bubble">${i<statusN?ico('check',17):i+1}</div><strong>${x}</strong><small>${i<=statusN?'Recorded':'Pending'}</small></div>`).join('')}</div></div><div class="panel panel-pad"><div class="panel-head"><h2>Updates and comments</h2><small>${r.updates.length} updates</small></div>${r.updates.map(u=>`<div class="update"><div class="avatar">${u[0].startsWith('You')?'JC':'CB'}</div><div><div class="person">${escapeHtml(u[0])}<time>${u[2]}</time></div><p>${escapeHtml(u[1])}</p></div></div>`).join('')}<form id="comment-form" style="display:flex;gap:9px;margin-top:16px"><input style="flex:1;min-width:0;border:1px solid #cfdae5;border-radius:8px;padding:10px 11px" placeholder="Add a comment or clarification" id="comment-body" required/><button class="btn btn-primary btn-small">Post comment</button></form></div></div><div><div class="panel panel-pad" style="margin-bottom:18px"><h2 style="margin-bottom:17px">Request information</h2>${[['Request number',r.id],['Date submitted',r.submitted],['Service category',r.category],['Priority',r.priority],['Assigned department',r.department]].map(([k,v])=>`<div class="side-stat"><span class="muted">${k}</span><strong>${escapeHtml(v)}</strong></div>`).join('')}</div><div class="panel panel-pad"><div class="panel-head"><h2>Reported location</h2></div><div class="map" style="height:145px"><div class="map-pin">${ico('map',16)}</div></div><p class="muted" style="font-size:11px;margin:10px 0 0">${escapeHtml(r.location)}</p></div></div></div>`}
function staff(){let all=state.requests;return `${heading('Employee workspace','Service request management','Review incoming reports, assign departments, and keep residents informed.',`<button class="btn btn-secondary" data-go="dashboard">${ico('users',16)} Resident view</button>`)}<div class="staff-stats"><div class="staff-stat"><small>Total requests</small><strong>${all.length}</strong><span>Current demo dataset</span></div><div class="staff-stat"><small>Open requests</small><strong>${all.filter(r=>r.status==='Open').length}</strong><span>Awaiting staff review</span></div><div class="staff-stat"><small>In progress</small><strong>${all.filter(r=>r.status==='In Progress').length}</strong><span>Assigned work</span></div><div class="staff-stat"><small>Resolved</small><strong>${all.filter(r=>r.status==='Resolved').length}</strong><span class="up">Completed requests</span></div></div><div class="panel panel-pad"><div class="panel-head"><div><h2>Incoming service requests</h2><small>Choose a request to assign work or update its status</small></div><span class="badge progress">Staff workspace</span></div><div class="filterbar"><div class="search">${ico('search',17)}<input id="staff-search" placeholder="Search by request ID, address, or resident"/></div><select class="filter" id="staff-filter">${['All statuses','Open','In Progress','Resolved'].map(x=>`<option ${x===state.staffFilter?'selected':''}>${x}</option>`).join('')}</select><button class="btn btn-secondary btn-small" id="reset-filters">${ico('filter',14)} Reset filters</button></div><table class="staff-table"><thead><tr><th>Request ID</th><th>Issue / location</th><th>Resident</th><th>Department</th><th>Priority</th><th>Status</th><th>Manage</th></tr></thead><tbody id="staff-rows">${staffRows()}</tbody></table></div>`}
function staffRows(){let filtered=state.requests.filter(r=>(state.staffFilter==='All statuses'||r.status===state.staffFilter)&&(`${r.id} ${r.title} ${r.location} ${r.resident}`.toLowerCase().includes(state.staffQuery.toLowerCase())));return filtered.map(r=>`<tr><td><button class="idlink" data-openstaff="${r.id}">${r.id}</button></td><td><span class="name">${escapeHtml(r.title)}</span><div class="muted" style="font-size:10px;margin-top:3px">${escapeHtml(r.location)}</div></td><td>${escapeHtml(r.resident)}</td><td>${escapeHtml(r.department)}</td><td>${escapeHtml(r.priority)}</td><td>${badge(r.status)}</td><td><button class="btn btn-secondary btn-small" data-openstaff="${r.id}">Manage ${ico('arrow',13)}</button></td></tr>`).join('')||'<tr><td colspan="7">No requests match this filter.</td></tr>'}
function staffDetail(){let r=getReq();return `${heading('Staff workspace',`Manage request · ${r.id}`,`${escapeHtml(r.title)} · ${escapeHtml(r.location)}`,`<button class="btn btn-secondary" data-go="staff">${ico('back',16)} Back to service queue</button>`)}<div class="layout-detail"><div><div class="panel panel-pad" style="margin-bottom:18px"><div class="panel-head"><h2>Resident issue report</h2>${badge(r.status)}</div><h3 style="font-size:18px;margin-bottom:10px">${escapeHtml(r.title)}</h3><p class="muted">${escapeHtml(r.description)}</p><div class="kv"><div><label>Resident</label><span>${escapeHtml(r.resident)}</span></div><div><label>Category</label><span>${escapeHtml(r.category)}</span></div><div><label>Submitted</label><span>${r.submitted}</span></div></div></div><div class="panel panel-pad"><div class="panel-head"><div><h2>Resident-facing activity</h2><small>Status changes will be reflected in request tracking.</small></div></div>${r.updates.map(u=>`<div class="update"><div class="avatar">CB</div><div><div class="person">${escapeHtml(u[0])}<time>${u[2]}</time></div><p>${escapeHtml(u[1])}</p></div></div>`).join('')}</div></div><div><div class="panel panel-pad" style="margin-bottom:18px"><h2 style="margin-bottom:18px">Assignment & status</h2><form id="staff-update"><div class="field"><label class="label" for="department">Assigned department</label><select id="department">${['Public Works','Parks','Sanitation','Facilities'].map(x=>`<option ${x===r.department?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="label" for="request-status">Request status</label><select id="request-status">${['Open','In Progress','Resolved'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="label" for="staff-note">Public update</label><textarea id="staff-note" style="min-height:74px" placeholder="Optional message to the resident"></textarea></div><button class="btn btn-primary" style="width:100%">Save changes ${ico('check',17)}</button></form></div><div class="tip">${ico('shield',18)}<span>Prototype only: updates are saved in browser memory for the current session. No real resident data is transmitted.</span></div></div></div>`}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hide');setTimeout(()=>el.classList.add('hide'),3500)}
function render(){let content={dashboard,new:form,my,detail,staff,staffdetail:staffDetail}[state.screen]();document.getElementById('app').innerHTML=shell(content);document.title=`CivicBridge · ${{dashboard:'Resident Dashboard',new:'New Request',my:'My Requests',detail:'Request Tracking',staff:'Employee Dashboard',staffdetail:'Staff Request Management'}[state.screen]}`;window.scrollTo(0,0)}
function navigate(screen,id){if(id)state.selected=id;state.screen=screen;render()}
document.addEventListener('click',e=>{if(e.target.closest('#demo-logout')){try{sessionStorage.removeItem('civicbridgeDemoSession')}catch(e){};window.location.assign('login.html');return;}let a=e.target.closest('[data-go]');if(a){navigate(a.dataset.go);return;}let b=e.target.closest('[data-open]');if(b){navigate('detail',b.dataset.open);return;}let c=e.target.closest('[data-openstaff]');if(c){navigate('staffdetail',c.dataset.openstaff);return;}if(e.target.closest('#reset-filters')){state.staffFilter='All statuses';state.staffQuery='';render();}});
document.addEventListener('change',e=>{if(e.target.id==='my-filter'){state.statusFilter=e.target.value;render()}if(e.target.id==='staff-filter'){state.staffFilter=e.target.value;render()}if(e.target.id==='f-photo'){document.getElementById('photo-status').textContent=e.target.files[0]?`Selected: ${e.target.files[0].name}`:''}});
document.addEventListener('input',e=>{if(e.target.id==='staff-search'){state.staffQuery=e.target.value;document.getElementById('staff-rows').innerHTML=staffRows()}if(e.target.id==='my-search'){let s=e.target.value.toLowerCase();document.querySelectorAll('#my-rows tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(s)?'':'none')}});
document.addEventListener('submit',e=>{if(e.target.id==='request-form'){e.preventDefault();let n=String(Math.max(...state.requests.map(r=>Number(r.id.split('-')[1])))+1).padStart(5,'0');let cat=document.getElementById('f-category').value;let r={id:'SR-'+n,title:document.getElementById('f-title').value,category:cat,location:document.getElementById('f-address').value,resident:'Jordan Carter',submitted:'Nov 4, 2026',status:'Open',department:cat==='Parks & Recreation'?'Parks':cat==='Waste & Recycling'?'Sanitation':'Public Works',priority:document.getElementById('f-priority').value,description:document.getElementById('f-description').value,updates:[['Request received','Your request was submitted successfully.','Nov 4, 2026']]};state.requests.unshift(r);navigate('detail',r.id);toast('Request submitted successfully — '+r.id)}if(e.target.id==='comment-form'){e.preventDefault();let msg=document.getElementById('comment-body').value.trim();if(msg){getReq().updates.unshift(['You commented',msg,'Nov 4, 2026']);render();toast('Comment added to the request')}}if(e.target.id==='staff-update'){e.preventDefault();let r=getReq(),old=r.status,newStatus=document.getElementById('request-status').value;r.status=newStatus;r.department=document.getElementById('department').value;let note=document.getElementById('staff-note').value.trim();if(old!==newStatus||note){r.updates.unshift([`Status: ${newStatus}`,note||`The request status was updated to ${newStatus.toLowerCase()}.`,'Nov 4, 2026'])}render();toast('Changes saved for '+r.id)}});
window.CivicBridgeDemo={navigate,getState:()=>state};render();
</script></body></html>
